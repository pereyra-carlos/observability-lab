# Las claves son NOMBRES DE ARCHIVO: el chart escribe cada una en
# /etc/grafana/provisioning/alerting/. Un nivel de mas y crea directorios,
# que Grafana saltea con un warn que nadie mira.
#
# __dashboardUid__ y __panelId__ van juntos o Grafana no arranca.
#
# El datasource de OpenSearch EXIGE agregaciones: sin bucketAggs devuelve
# 'invalid query, missing metrics and aggregations'.
#
# Y el reducer es 'max', no 'last': el ultimo bucket del histograma siempre
# esta incompleto, asi que 'last' toma un valor artificialmente bajo y la regla
# oscila entre pending e inactive con la condicion cumplida. Un bucket parcial
# siempre es menor que uno completo, de modo que 'max' nunca lo elige.
contactpoints.yaml:
  apiVersion: 1
  contactPoints:
  - orgId: 1
    name: alert-webhook
    receivers:
    - uid: alert-webhook
      type: webhook
      disableResolveMessage: false
      settings:
        url: ${ALERT_WEBHOOK_URL}
        httpMethod: POST
policies.yaml:
  apiVersion: 1
  policies:
  - orgId: 1
    receiver: grafana-default-email
    group_by:
    - grafana_folder
    - alertname
    routes:
    - receiver: alert-webhook
      object_matchers:
      - - lab
        - '='
        - observability
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
rules.yaml:
  apiVersion: 1
  groups:
  - orgId: 1
    name: vantia-cost
    folder: Vantia
    interval: 1m
    rules:
    - uid: vantia-cost-spike
      title: The model bill is running hot
      condition: C
      for: 5m
      noDataState: OK
      execErrState: Error
      labels:
        lab: observability
        severity: warning
      annotations:
        summary: Vantia's model spend over the last 10 minutes is {{`{{ $values.B.Value | printf "%.4f"
          }}`}} USD, past the 0.60 line. Normal is around 0.23.
        description: 'Something is making the assistant answer at a higher cost than usual: more traffic,
          longer answers, or requests landing on the expensive model. The dashboard breaks it down by
          tenant and model.'
        __dashboardUid__: vantia-request
        __panelId__: '1'
      data:
      - refId: A
        relativeTimeRange:
          from: 1800
          to: 0
        datasourceUid: opensearch-logs
        model:
          refId: A
          query: stage:generate
          queryType: lucene
          timeField: '@timestamp'
          metrics:
          - id: '1'
            type: sum
            field: cost_usd
          bucketAggs:
          - id: '2'
            type: date_histogram
            field: '@timestamp'
            settings:
              interval: 10m
              min_doc_count: '1'
      - refId: B
        relativeTimeRange:
          from: 1800
          to: 0
        datasourceUid: __expr__
        model:
          refId: B
          type: reduce
          reducer: max
          expression: A
      - refId: C
        relativeTimeRange:
          from: 1800
          to: 0
        datasourceUid: __expr__
        model:
          refId: C
          type: threshold
          expression: B
          conditions:
          - evaluator:
              type: gt
              params:
              - 0.6
