apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: lab-requires-low-priority
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: "has(object.spec.priorityClassName) && object.spec.priorityClassName == 'lab-low'"
      message: "pods in lab namespaces must set priorityClassName: lab-low so the kubelet evicts them before production workloads"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: lab-requires-low-priority
spec:
  policyName: lab-requires-low-priority
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        tier: lab
