apiVersion: v1
kind: LimitRange
metadata:
  name: lab-defaults
  namespace: observability
spec:
  limits:
    - type: Container
      default:
        memory: 512Mi
        cpu: 500m
      defaultRequest:
        memory: 128Mi
        cpu: 50m
---
apiVersion: v1
kind: LimitRange
metadata:
  name: lab-defaults
  namespace: vantia
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
        cpu: 250m
      defaultRequest:
        memory: 64Mi
        cpu: 25m
