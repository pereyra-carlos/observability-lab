kind: DaemonSet

image:
  repository: fluent/fluent-bit
  tag: 4.2.3

priorityClassName: lab-low

tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 300m
    memory: 192Mi

envFrom:
  - secretRef:
      name: opensearch-fluentbit-env

extraVolumes:
  - name: fb-buffer
    hostPath:
      path: /var/lib/fluent-bit-lab
      type: DirectoryOrCreate

extraVolumeMounts:
  - name: fb-buffer
    mountPath: /var/fluent-bit/state

config:
  service: |
    [SERVICE]
        Daemon                    Off
        Flush                     5
        Log_Level                 info
        Parsers_File              /fluent-bit/etc/parsers.conf
        Parsers_File              custom_parsers.conf
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 2020
        Health_Check              On
        storage.path              /var/fluent-bit/state/flb-storage/
        storage.sync              normal
        storage.checksum          off
        storage.backlog.mem_limit 32M

  inputs: |
    [INPUT]
        Name                tail
        Alias               vantia_containers
        Tag                 kube.<namespace_name>.<pod_name>.<container_name>
        Tag_Regex           (?<pod_name>[a-z0-9](?:[-a-z0-9]*[a-z0-9])?(?:\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*)_(?<namespace_name>[^_]+)_(?<container_name>.+)-(?<docker_id>[a-z0-9]{64})\.log$
        Path                /var/log/containers/*_vantia_*.log
        Exclude_Path        /var/log/containers/*_observability_*.log,/var/log/containers/*_kube-system_*.log
        multiline.parser    cri
        Mem_Buf_Limit       16MB
        Skip_Long_Lines     On
        Refresh_Interval    10
        DB                  /var/fluent-bit/state/tail.db
        storage.type        filesystem

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.
        Regex_Parser        kube_tag
        Merge_Log           Off
        Keep_Log            On
        Labels              On
        Annotations         Off
        Buffer_Size         256k

    [FILTER]
        Name                parser
        Match               kube.*
        Key_Name            log
        Parser              vantia_json
        Reserve_Data        On
        Preserve_Key        Off

    [FILTER]
        Name                modify
        Match               kube.*
        Remove              _p
        Remove              logtag

  customParsers: |
    [PARSER]
        Name                vantia_json
        Format              json
        Time_Key            ts
        Time_Format         %Y-%m-%dT%H:%M:%S.%LZ
        Time_Keep           On

    [PARSER]
        Name                kube_tag
        Format              regex
        Regex               ^(?<namespace_name>[^.]+)\.(?<pod_name>[^.]+)\.(?<container_name>.+)$

  outputs: |
    [OUTPUT]
        Name                opensearch
        Match               kube.*
        Host                opensearch
        Port                9200
        HTTP_User           ${OS_USER}
        HTTP_Passwd         ${OS_PASSWORD}
        tls                 On
        tls.verify          Off
        Index               logs-k8s
        Suppress_Type_Name  On
        Generate_ID         On
        Time_Key            @timestamp
        Logstash_Format     Off
        Trace_Error         On
        Retry_Limit         5
        storage.total_limit_size 256M
